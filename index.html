<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<!-- 內容安全政策（GitHub Pages 不能設 HTTP 標頭，所以用 meta）：只允許本站的腳本，不連任何外部網址。
     style 'unsafe-inline'：介面圖示用 style 屬性、Phaser 在 iPad 量高度時用 setAttribute('style')。
     img data: blob:：Phaser 內建貼圖是 data URI、Phaser 以 XHR 載圖後轉 blob URL；file:// 模式用打包的 data URI。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; media-src 'self' data: blob:; font-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">

<link rel="manifest" href="manifest.webmanifest?v=fef89cffec">
<meta name="theme-color" content="#1d2b5e">
<meta name="apple-mobile-web-app-capable" content="yes">
